[workspace]
members = ["unbound", "unbound-derive"]
resolver = "2"

[workspace.dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = [
  "full",
  "extra-traits",
  "visit",
  "visit-mut",
] }
thiserror = "^2.0.17"
hashbrown = { version = "0.17", default-features = false }
foldhash = "0.2"
